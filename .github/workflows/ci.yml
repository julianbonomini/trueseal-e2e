name: E2E

env:
  # The exact sha256 of the pinned core's Swift artifact (the core
  # release's published checksum — G8). The harness refuses to fetch the
  # XCFramework for a pinned Swift checkout without it. Must move in
  # lockstep with the trueseal-sync release train (the Release Conductor,
  # E2E-8, owns this at release time).
  TRUESEAL_SWIFT_CORE_SHA256: 61557fb4b084087ee6fbd757647c0cef604adb45144cc7a98e03c6d5ebf6c3c8
  # The artifact fetch authenticates its GitHub API calls in CI — the
  # unauthenticated 60/hr budget is shared per runner IP and 403s under
  # load. Reading the PUBLIC mirror repo with the job token is allowed.
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Dev Mode nightly: builds sibling main HEADs, never gates (e2e ADR-0001).
    - cron: '17 3 * * *'

jobs:
  gate:
    # THE RELEASE GATE SHAPE: no sibling checkouts anywhere in this job.
    # scripts/run.mjs clones the exact pins.json refs into an isolated tree
    # and refuses sibling overrides, escaping path deps and unpinned refs
    # (E2E-9 / G8).
    name: "gate / ${{ matrix.lane }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Scenario Suite (E2E-1 / G1): the same scenario files through
          # the shared Scenario Driver, one lane per SDK. Kotlin's headless
          # lane runs on Linux by design (e2e ADR-0001).
          - lane: scenario-ts
            os: ubuntu-latest
            command: node scripts/run-scenarios.mjs ts --mode gate
          - lane: scenario-kotlin
            os: ubuntu-latest
            command: node scripts/run-scenarios.mjs kotlin --mode gate
            java: true
          - lane: scenario-swift
            os: macos-latest
            command: node scripts/run-scenarios.mjs swift --mode gate
          - lane: relay-privacy
            os: ubuntu-latest
            command: node scripts/run-privacy.mjs --mode gate
          - lane: rust-typescript
            os: ubuntu-latest
            command: node scripts/run-interop.mjs rust --mode gate
          - lane: swift-typescript
            os: macos-latest
            command: node scripts/run-interop.mjs swift --mode gate

    steps:
      - name: Checkout E2E harness
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 17 (Kotlin Scenario Driver lane)
        if: matrix.java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up JDK 17 (Kotlin Scenario Driver lane)
        if: matrix.java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The duplicate-inbox helper's regression tests (E3b: the watermark
      # discipline that keeps at-least-once inbox rows from racing the
      # system suite). Its module is self-contained (scripts/go.mod).
      - name: Test duplicate-inbox helper
        working-directory: scripts
        run: go test ./...

      - name: Run ${{ matrix.lane }} (gate mode)
        run: ${{ matrix.command }}

      # G7 Release Evidence (E2E-7 completion criterion: "Output is included
      # in Release Evidence"). A lane that can't run counts as a failure, so
      # missing evidence is an error, not a skip.
      - name: Upload G7 privacy evidence
        if: matrix.lane == 'relay-privacy'
        uses: actions/upload-artifact@v7
        with:
          name: g7-privacy-evidence
          path: gates/evidence/g7-privacy-*.json
          if-no-files-found: error

  dev:
    # DEV MODE: builds sibling main HEADs for early feedback. It runs on e2e
    # changes and nightly, is labeled non-gating, and never blocks a release
    # (e2e ADR-0001 "Dev Mode ... never gates a release").
    name: "dev / ${{ matrix.lane }} (non-gating)"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: scenario-ts
            os: ubuntu-latest
            command: node scripts/run-scenarios.mjs ts --mode dev
            needs_ts: true
          - lane: scenario-kotlin
            os: ubuntu-latest
            command: node scripts/run-scenarios.mjs kotlin --mode dev
            needs_kotlin: true
            java: true
          - lane: scenario-swift
            os: macos-latest
            command: node scripts/run-scenarios.mjs swift --mode dev
            needs_ts: true
            needs_swift: true
          - lane: relay-privacy
            os: ubuntu-latest
            command: node scripts/run-privacy.mjs --mode dev
            needs_ts: true
          - lane: rust-typescript
            os: ubuntu-latest
            command: node scripts/run-interop.mjs rust --mode dev
            needs_ts: true
          - lane: swift-typescript
            os: macos-latest
            command: node scripts/run-interop.mjs swift --mode dev
            needs_ts: true
            needs_swift: true

    steps:
      - name: Checkout E2E harness
        uses: actions/checkout@v7
        with:
          path: trueseal-e2e

      - name: Checkout relay
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/trueseal-relay
          path: trueseal-relay

      - name: Checkout sync core
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/trueseal-sync
          path: trueseal-sync

      - name: Checkout TypeScript SDK
        if: matrix.needs_ts
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/trueseal-sync-ts
          path: trueseal-sync-ts

      - name: Checkout Swift SDK
        if: matrix.needs_swift
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/trueseal-sync-swift
          path: trueseal-sync-swift

      - name: Checkout Kotlin SDK (dev mode builds sibling HEADs)
        if: matrix.needs_kotlin
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/trueseal-sync-kotlin
          path: trueseal-sync-kotlin

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-go@v7
        with:
          go-version-file: trueseal-relay/go.mod
          cache-dependency-path: trueseal-relay/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - name: Run ${{ matrix.lane }} (DEV MODE — non-gating)
        working-directory: trueseal-e2e
        run: ${{ matrix.command }}
